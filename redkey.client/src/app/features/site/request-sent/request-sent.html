@let d = i18n.t().site.done;
<section class="page">
  <div class="box">
    <div class="ring"><span><app-icon name="check" [size]="34" [stroke]="2.6" /></span></div>
    <h1>{{ d.title }}</h1>
    <p>{{ d.text }}</p>
    <div class="actions">
      <a class="btn btn-primary btn-lg" [routerLink]="base() || '/'">{{ d.home }}</a>
      <a class="btn btn-outline btn-lg" [routerLink]="base() + '/properties'">{{ d.browse }}</a>
    </div>
  </div>
</section>
