@let t = i18n.t();
@let h = t.landing.hero;
<section class="hero">
  <img class="bg" [ngSrc]="image" fill priority alt="" />
  <div class="overlay"></div>

  <div class="container content">
    @if (firstName(); as name) {
      <span class="eyebrow light">{{ h.welcome }} {{ name }} 👋</span>
    } @else {
      <span class="eyebrow light">{{ h.eyebrow }}</span>
    }
    <h1>{{ h.title }}</h1>
    <p>{{ h.subtitle }}</p>

    <form class="search" (submit)="search($event)">
      <div class="tabs-row" role="tablist">
        <button type="button" role="tab" class="s-tab" [class.active]="purpose() === 'sale'" (click)="purpose.set('sale')">{{ h.tabBuy }}</button>
        <button type="button" role="tab" class="s-tab" [class.active]="purpose() === 'rent'" (click)="purpose.set('rent')">{{ h.tabRent }}</button>
      </div>

      <div class="fields">
        <label class="f">
          <span><app-icon name="pin" [size]="16" />{{ h.location }}</span>
          <select [value]="area()" (change)="area.set($any($event.target).value)">
            <option value="">{{ h.anyLocation }}</option>
            @for (a of areas; track a.id) {
              <option [value]="a.id">{{ a.name | loc: i18n.lang() }}</option>
            }
          </select>
        </label>

        <label class="f">
          <span><app-icon name="home" [size]="16" />{{ h.type }}</span>
          <select [value]="type()" (change)="type.set($any($event.target).value)">
            <option value="">{{ h.anyType }}</option>
            @for (type of types; track type) {
              <option [value]="type">{{ t.propertyTypes[type] }}</option>
            }
          </select>
        </label>

        <label class="f" [class.disabled]="purpose() === 'rent'">
          <span><app-icon name="money" [size]="16" />{{ h.price }}</span>
          <select [value]="maxPrice()" (change)="maxPrice.set($any($event.target).value)" [disabled]="purpose() === 'rent'">
            <option value="">{{ h.anyPrice }}</option>
            <option [value]="prices[0]">{{ t.site.listings.under5 }}</option>
            <option [value]="prices[1]">{{ t.site.listings.under10 }}</option>
            <option [value]="prices[2]">{{ t.site.listings.under20 }}</option>
          </select>
        </label>

        <button type="submit" class="btn btn-primary btn-lg go">
          <app-icon name="search" [size]="18" />{{ h.search }}
        </button>
      </div>
    </form>

    <span class="stat"><app-icon name="checkCircle" [size]="18" />{{ h.stats }}</span>
  </div>
</section>
