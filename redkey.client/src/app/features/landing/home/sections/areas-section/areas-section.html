@if (areas().length) {
  <section class="section areas">
    <div class="container">
      <div class="section-head">
        <div>
          <span class="eyebrow">{{ 'landing.areas.eyebrow' | translate }}</span>
          <h2 class="section-title">{{ 'landing.areas.title' | translate }}</h2>
          <p class="section-sub">{{ 'landing.areas.subtitle' | translate }}</p>
        </div>
      </div>

      <div class="grid" [attr.data-count]="areas().length">
        @for (area of areas(); track area.id; let first = $first) {
          <a class="area img-frame" [class.big]="first" routerLink="/properties" [queryParams]="{ city: area.id }">
            <img [ngSrc]="area.image" fill [alt]="area.name" />
            <div class="shade"></div>
            <div class="info"><b>{{ area.name }}</b></div>
            <span class="go"><app-icon name="arrowEnd" [size]="18" [flip]="true" /></span>
          </a>
        }
      </div>
    </div>
  </section>
}
