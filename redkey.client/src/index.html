<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>RedKey</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="RedKey – buy, rent and invest in real estate in Egypt.">
  <meta name="theme-color" content="#A3122A">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <script>
    // Apply the saved language before the first paint (no RTL/LTR flash).
    try {
      var l = localStorage.getItem('rk.lang');
      if (l === 'en') { document.documentElement.lang = 'en'; document.documentElement.dir = 'ltr'; }
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
