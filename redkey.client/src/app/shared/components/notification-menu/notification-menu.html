@let t = i18n.t();
<button
  type="button"
  class="bell"
  (click)="toggle()"
  [attr.aria-expanded]="open()"
  aria-haspopup="true"
  [attr.aria-label]="t.account.notifications">
  <app-icon name="bell" [size]="20" />
  @if (unread() > 0) {
    <span class="count">{{ unread() }}</span>
  }
</button>

@if (open()) {
  <div class="panel" role="menu">
    <div class="panel-head">
      <b>{{ t.account.notifications }}</b>
      @if (unread() > 0) {
        <button type="button" class="link" (click)="markAllRead()">{{ t.account.markAllRead }}</button>
      }
    </div>
    @for (n of list(); track n.id) {
      <div class="item" [class.unread]="!n.read">
        <span class="item-icon"><app-icon [name]="n.icon" [size]="18" /></span>
        <div class="item-body">
          <b>{{ n.title | loc: i18n.lang() }}</b>
          <span>{{ n.body | loc: i18n.lang() }}</span>
          <small>{{ n.time | loc: i18n.lang() }}</small>
        </div>
      </div>
    } @empty {
      <p class="empty">{{ t.account.noNotifications }}</p>
    }
  </div>
}
