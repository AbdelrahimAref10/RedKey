<button
  type="button"
  class="bell"
  (click)="toggle()"
  [attr.aria-expanded]="open()"
  aria-haspopup="true"
  [attr.aria-label]="'account.notifications' | translate">
  <app-icon name="bell" [size]="20" />
  @if (unread() > 0) {
    <span class="count">{{ unread() > 99 ? '99+' : unread() }}</span>
  }
</button>

@if (open()) {
  <div class="panel" role="menu">
    <div class="panel-head">
      <b>{{ 'account.notifications' | translate }}</b>
      @if (unread() > 0) {
        <button type="button" class="link" (click)="markAllRead.emit()">{{ 'account.markAllRead' | translate }}</button>
      }
    </div>
    <div class="list">
      @for (n of items(); track n.id) {
        <button type="button" class="item" role="menuitem" [class.unread]="!n.read" (click)="select(n)">
          <span class="item-icon"><app-icon [name]="n.icon" [size]="18" /></span>
          <span class="item-body">
            <b>{{ n.title }}</b>
            <span>{{ n.body }}</span>
            <small>{{ n.time }}</small>
          </span>
        </button>
      } @empty {
        <p class="empty">{{ 'account.noNotifications' | translate }}</p>
      }
    </div>
  </div>
}
