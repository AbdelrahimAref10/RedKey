<section class="hero">
  <img class="bg" [ngSrc]="image" fill priority alt="" />
  <div class="overlay"></div>

  <div class="container content">
    @if (firstName(); as name) {
      <span class="eyebrow light">{{ 'landing.hero.welcome' | translate }} {{ name }} 👋</span>
    } @else {
      <span class="eyebrow light">{{ 'landing.hero.eyebrow' | translate }}</span>
    }
    <h1>{{ 'landing.hero.title' | translate }}</h1>
    <p>{{ 'landing.hero.subtitle' | translate }}</p>

    <form class="search" (submit)="search($event)">
      <div class="tabs-row" role="tablist">
        @for (p of purposes(); track p.value) {
          <button type="button" role="tab" class="s-tab" [class.active]="purpose() === p.value" (click)="purpose.set(p.value)">{{ p.name }}</button>
        }
      </div>

      <div class="fields">
        <label class="f">
          <span><app-icon name="pin" [size]="16" />{{ 'landing.hero.location' | translate }}</span>
          <select [value]="cityId()" (change)="cityId.set($any($event.target).value)">
            <option value="">{{ 'landing.hero.anyLocation' | translate }}</option>
            @for (c of cities(); track c.id) {
              <option [value]="c.id">{{ c.name }}</option>
            }
          </select>
        </label>

        <label class="f">
          <span><app-icon name="home" [size]="16" />{{ 'landing.hero.type' | translate }}</span>
          <select [value]="typeId()" (change)="typeId.set($any($event.target).value)">
            <option value="">{{ 'landing.hero.anyType' | translate }}</option>
            @for (type of unitTypes(); track type.id) {
              <option [value]="type.id">{{ type.name }}</option>
            }
          </select>
        </label>

        <label class="f">
          <span><app-icon name="money" [size]="16" />{{ 'landing.hero.price' | translate }}</span>
          <select [value]="maxPrice()" (change)="maxPrice.set($any($event.target).value)">
            <option value="">{{ 'landing.hero.anyPrice' | translate }}</option>
            <option [value]="prices[0]">{{ 'site.listings.under5' | translate }}</option>
            <option [value]="prices[1]">{{ 'site.listings.under10' | translate }}</option>
            <option [value]="prices[2]">{{ 'site.listings.under20' | translate }}</option>
          </select>
        </label>

        <button type="submit" class="btn btn-primary btn-lg go">
          <app-icon name="search" [size]="18" />{{ 'landing.hero.search' | translate }}
        </button>
      </div>
    </form>
  </div>
</section>
