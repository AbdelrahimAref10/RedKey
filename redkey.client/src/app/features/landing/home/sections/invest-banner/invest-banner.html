<section class="wrap">
  <div class="container">
    <div class="banner">
      <div class="text">
        <span class="tag"><app-icon name="trending" [size]="16" />{{ 'landing.invest.eyebrow' | translate }}</span>
        <h2>{{ 'landing.invest.title' | translate }}</h2>
        <p>{{ 'landing.invest.text' | translate }}</p>
      </div>
      <div class="steps">
        @for (step of ('site.invest.steps' | translate); track $index) {
          <div class="step"><b>{{ $index + 1 }}</b><span>{{ step }}</span></div>
        }
      </div>
      <a class="btn btn-light btn-lg" routerLink="/invest">
        {{ 'landing.invest.cta' | translate }}<app-icon name="arrowEnd" [size]="18" [flip]="true" />
      </a>
    </div>
  </div>
</section>
