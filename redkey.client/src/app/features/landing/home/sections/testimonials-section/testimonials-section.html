@let lang = i18n.lang();
<section class="section testimonials">
  <div class="container">
    <div class="section-head center">
      <div>
        <span class="eyebrow">{{ 'landing.testimonials.eyebrow' | translate }}</span>
        <h2 class="section-title">{{ 'landing.testimonials.title' | translate }}</h2>
      </div>
    </div>

    <div class="grid">
      @for (item of items; track $index) {
        <figure class="quote">
          <span class="mark"><app-icon name="quote" [size]="28" [filled]="true" [stroke]="0" /></span>
          <div class="stars">
            @for (s of stars; track s) {
              <app-icon name="star" [size]="16" [filled]="true" [stroke]="0" />
            }
          </div>
          <blockquote>{{ item.quote | loc: lang }}</blockquote>
          <figcaption>
            <span class="avatar">{{ (item.name | loc: lang).charAt(0) }}</span>
            <span><b>{{ item.name | loc: lang }}</b><small>{{ item.role | loc: lang }}</small></span>
          </figcaption>
        </figure>
      }
    </div>
  </div>
</section>
