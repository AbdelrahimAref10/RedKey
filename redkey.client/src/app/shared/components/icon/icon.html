<svg
  [attr.width]="size()"
  [attr.height]="size()"
  viewBox="0 0 24 24"
  [attr.fill]="filled() ? 'currentColor' : 'none'"
  stroke="currentColor"
  [attr.stroke-width]="stroke()"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
  focusable="false">
  @for (d of paths(); track $index) {
    <path [attr.d]="d" />
  }
</svg>
